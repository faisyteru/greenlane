<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenLane – Prototype</title>
<style>
:root{--or:#F26B1D;--or2:#FDE9DC;--navy:#1B2E5A;--gr:#0F7B5F;--gr2:#E1F2EB;--bg:#F5F6FA;--card:#fff;--tx:#1A2233;--mu:#6B7488;--bd:#E3E6EE;--rd:#C93C3C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1626;--card:#18223A;--tx:#EEF1F8;--mu:#9AA5BF;--bd:#2A3656;--or2:#3A2418;--gr2:#12352D}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--or);display:grid;place-items:center;font-weight:800}
header h1{font-size:17px;margin:0}header small{opacity:.75;display:block;font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:9px 14px;border-radius:999px;font-weight:600;white-space:nowrap;cursor:pointer;font:inherit}
nav button.on{background:var(--or);color:#fff}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:12px}.kpi b{font-size:22px;display:block}.kpi span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.keep{background:var(--gr2);color:var(--gr)}.pri{background:var(--or2);color:var(--or)}.rev{background:#FBE3E3;color:var(--rd)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.sl{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
input[type=range]{accent-color:var(--or);width:100%}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
select{padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.rank{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--bd);margin-bottom:8px}
.rank.top{border-color:var(--gr);background:var(--gr2)}.rk{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.sc{margin-left:auto;font-size:22px;font-weight:800;color:var(--gr)}
svg text{font-family:inherit}.node{cursor:pointer}
.info{background:var(--or2);border-radius:12px;padding:12px;margin-top:10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.note{font-size:12px;color:var(--mu)}
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.pal div{border-radius:12px;padding:12px;color:#fff;font-size:12px;min-height:80px;display:flex;flex-direction:column;justify-content:flex-end}.pal b{font-size:13px}
</style></head><body>
<header><div class="logo">GL</div><div><h1>GreenLane</h1><small>Green Logistics Partner Intelligence · KAI Logistik</small></div></header>
<nav id="nav"></nav>
<main id="m"></main>
<script>
const P=[
{n:'Mitra A',t:'Truk diesel',c:700,e:100,o:88,d:1.8,s:90,q:[84,85,86,88]},
{n:'Mitra B',t:'Biodiesel B50',c:800,e:70,o:93,d:1.1,s:95,q:[89,90,92,93]},
{n:'Mitra C',t:'EV feeder',c:950,e:15,o:96,d:0.6,s:97,q:[92,94,95,96]},
{n:'Mitra D',t:'HVO',c:850,e:40,o:94,d:1.0,s:94,q:[90,91,93,94]}];
const K=[['c','Biaya per shipment',0],['e','Emisi per leg',0],['o','On-time rate',1],['d','Damage rate',0],['s','SLA compliance',1]];
const PRE={Seimbang:[25,25,20,15,15],'Sensitif waktu':[20,10,35,15,20],'Rendah emisi':[20,45,10,10,15]};
let W=[...PRE.Seimbang],preset='Seimbang',view='dash',sel=2,fm=1,lm=1,tab=null;
const tabs=[['dash','Ringkasan'],['score','Partner Scorecard'],['rank','Ranking & Rekomendasi'],['map','Rute & Emisi'],['eval','Evaluasi Berkala'],['sim','Simulasi'],['pal','Warna']];
function topsis(){const sw=W.reduce((a,b)=>a+b,0)||1,w=W.map(x=>x/sw);
const nrm=K.map(([k])=>Math.sqrt(P.reduce((a,p)=>a+p[k]**2,0)));
const v=P.map(p=>K.map(([k],j)=>p[k]/nrm[j]*w[j]));
const best=K.map(([,,b],j)=>b?Math.max(...v.map(r=>r[j])):Math.min(...v.map(r=>r[j])));
const worst=K.map(([,,b],j)=>b?Math.min(...v.map(r=>r[j])):Math.max(...v.map(r=>r[j])));
return P.map((p,i)=>{const dp=Math.sqrt(v[i].reduce((a,x,j)=>a+(x-best[j])**2,0)),dn=Math.sqrt(v[i].reduce((a,x,j)=>a+(x-worst[j])**2,0));return Math.round(dn/(dp+dn)*100)})}
const st=s=>s>=80?['Pertahankan','keep']:s>=60?['Prioritaskan perbaikan','pri']:['Evaluasi ulang','rev'];
const rp=c=>'Rp'+c+' rb';
function lvl(p,k){return k=='e'?(p.e>80?'Tinggi':p.e>50?'Sedang':p.e>25?'Rendah':'Sangat rendah'):''}
function render(){
nav.innerHTML=tabs.map(([k,l])=>`<button class="${k==view?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('');
const S=topsis(),ord=P.map((p,i)=>i).sort((a,b)=>S[b]-S[a]);let h='';
if(view=='dash'){h=`<div class="card"><h2>Selamat datang, tim Operasional KAI Logistik</h2><p class="s">Pantau biaya, emisi, dan keandalan mitra feeder first/last mile dalam satu layar. Data pada prototype ini ilustrasi.</p>
<div class="grid"><div class="kpi"><b>${P.length}</b><span>Mitra feeder dipantau</span></div><div class="kpi"><b>${Math.round(P.reduce((a,p)=>a+p.o,0)/P.length)}%</b><span>Rata-rata on-time</span></div><div class="kpi"><b>${P[ord[0]].n}</b><span>Peringkat 1 (${preset})</span></div><div class="kpi"><b>${Math.round((1-P[2].e/P[0].e)*100)}%</b><span>Potensi turun emisi A → C</span></div></div></div>
<div class="card"><h2>Mulai dari sini</h2><p class="s">Lima langkah GreenLane:</p><div class="row">${[['score','1 Data mitra'],['rank','2 Ranking'],['rank','3 Rekomendasi'],['score','4 Scorecard'],['eval','5 Evaluasi']].map(([k,l])=>`<button class="btn" onclick="view='${k}';render()">${l}</button>`).join('')}</div></div>
<div class="card"><h2>Total cost-to-serve</h2><p class="s">Tarif + keterlambatan + kerusakan + emisi + risiko operasional (angka ilustrasi, ribu rupiah/shipment)</p>${P.map(p=>{const tc=ctc(p);return`<div class="sl" style="grid-template-columns:150px 1fr 70px"><span>${p.n} · ${p.t}</span><div class="bar"><i style="width:${tc/12}%;background:var(--or)"></i></div><b>${tc}</b></div>`}).join('')}<p class="note">Mitra termurah di tarif belum tentu termurah secara total.</p></div>`}
if(view=='score'){h=`<div class="card"><h2>Partner Scorecard</h2><p class="s">Bandingkan mitra pada lima indikator. Skor mengikuti bobot di menu Ranking.</p><div class="tw"><table><tr><th>Mitra</th>${K.map(k=>`<th>${k[1]}</th>`).join('')}<th>Skor</th><th>Status</th></tr>${P.map((p,i)=>`<tr><td><b>${p.n}</b><br><span class="note">${p.t}</span></td><td>${rp(p.c)}</td><td>${lvl(p,'e')}</td><td>${p.o}%</td><td>${p.d}%</td><td>${p.s}%</td><td><b>${S[i]}</b></td><td><span class="pill ${st(S[i])[1]}">${st(S[i])[0]}</span></td></tr>`).join('')}</table></div></div>`}
if(view=='rank'){h=`<div class="card"><h2>Atur bobot kriteria</h2><p class="s">Rute sensitif waktu dan rute rendah emisi punya prioritas berbeda. Pilih preset atau geser sendiri.</p><div class="row">${Object.keys(PRE).map(k=>`<button class="btn ${k==preset?'on':''}" onclick="preset='${k}';W=[...PRE['${k}']];render()">${k}</button>`).join('')}</div>${K.map((k,j)=>`<div class="sl"><span>${k[1]}</span><input type="range" min="0" max="60" value="${W[j]}" oninput="W[${j}]=+this.value;preset='Kustom';upd()"><b>${W[j]}</b></div>`).join('')}</div>
<div class="card"><h2>Rekomendasi mitra (AHP-TOPSIS)</h2><p class="s">Hasil menjawab: siapa yang paling sesuai kebutuhan rute, bukan sekadar termurah.</p><div id="rl">${rl(S,ord)}</div></div>`}
if(view=='map'){const p=P[fm],q=P[lm];const eFM=p.e*.2,eLM=q.e*.2,eRail=18,tot=Math.round(eFM+eLM+eRail);
const nodes=[[60,200,'Gudang asal','Titik first mile'],[200,110,'Feeder (first mile)',`${p.n}: ${Math.round(eFM)} kgCO₂e`],[360,200,'Stasiun asal','Konsolidasi barang'],[520,110,'Kereta (middle mile)',`${eRail} kgCO₂e (data KAI, ISO 14083)`],[680,200,'Stasiun tujuan','Bongkar muat'],[820,110,'Feeder (last mile)',`${q.n}: ${Math.round(eLM)} kgCO₂e`]];
h=`<div class="card"><h2>Peta rute & emisi per leg</h2><p class="s">Tap titik di peta untuk melihat detail. Pilih mitra tiap leg.</p><div class="row"><label>First mile <select onchange="fm=+this.value;render()">${P.map((x,i)=>`<option value="${i}" ${i==fm?'selected':''}>${x.n}</option>`).join('')}</select></label><label>Last mile <select onchange="lm=+this.value;render()">${P.map((x,i)=>`<option value="${i}" ${i==lm?'selected':''}>${x.n}</option>`).join('')}</select></label></div>
<div class="tw"><svg viewBox="0 0 900 290" width="100%" style="min-width:640px;background:var(--gr2);border-radius:16px"><path d="M60 200 C130 90 150 110 200 110 S300 200 360 200 S460 110 520 110 S620 200 680 200 S780 110 820 110" fill="none" stroke="var(--navy)" stroke-width="14" stroke-linecap="round" opacity=".18"/><path d="M60 200 C130 90 150 110 200 110 S300 200 360 200" fill="none" stroke="var(--or)" stroke-width="5" stroke-dasharray="10 9"/><path d="M360 200 S460 110 520 110 S620 200 680 200" fill="none" stroke="var(--navy)" stroke-width="5"/><path d="M680 200 S780 110 820 110" fill="none" stroke="var(--or)" stroke-width="5" stroke-dasharray="10 9"/>
${nodes.map((n,i)=>`<g class="node" onclick="tab=${i};render()"><circle cx="${n[0]}" cy="${n[1]}" r="${tab==i?24:19}" fill="${i%2?'var(--or)':'var(--navy)'}" stroke="#fff" stroke-width="4"/><text x="${n[0]}" y="${n[1]+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${i+1}</text><text x="${n[0]}" y="${n[1]+(i%2?-32:42)}" text-anchor="middle" fill="var(--tx)" font-size="13" font-weight="600">${n[2]}</text></g>`).join('')}</svg></div>
${tab!=null?`<div class="info"><b>${nodes[tab][2]}</b><br>${nodes[tab][3]}</div>`:''}
<div class="grid" style="margin-top:12px"><div class="kpi"><b>${tot}</b><span>Total kgCO₂e per shipment (ilustrasi)</span></div><div class="kpi"><b>${rp(p.c+q.c)}</b><span>Tarif first + last mile</span></div></div></div>`}
if(view=='eval'){const p=P[sel];const pts=p.q.map((v,i)=>`${40+i*130},${160-(v-80)*8}`).join(' ');
h=`<div class="card"><h2>Evaluasi berkelanjutan</h2><p class="s">Skor diperbarui dari data pengiriman aktual tiap kuartal.</p><div class="row">${P.map((x,i)=>`<button class="btn ${i==sel?'on':''}" onclick="sel=${i};render()">${x.n}</button>`).join('')}</div>
<svg viewBox="0 0 460 190" width="100%"><polyline points="${pts}" fill="none" stroke="var(--gr)" stroke-width="4"/>${p.q.map((v,i)=>`<circle cx="${40+i*130}" cy="${160-(v-80)*8}" r="6" fill="var(--or)"/><text x="${40+i*130}" y="${148-(v-80)*8}" text-anchor="middle" fill="var(--tx)" font-size="13">${v}%</text><text x="${40+i*130}" y="184" text-anchor="middle" fill="var(--mu)" font-size="12">K${i+1}</text>`).join('')}</svg>
<p>On-time rate ${p.n}: <b>${p.q[0]}% → ${p.q[3]}%</b>. Status saat ini: <span class="pill ${st(S[sel])[1]}">${st(S[sel])[0]}</span></p></div>`}
if(view=='sim'){const a=P[fm],b=P[lm];h=`<div class="card"><h2>Simulasi ganti mitra atau moda</h2><p class="s">Lihat dampak biaya dan emisi sebelum memutuskan.</p><div class="row"><label>Mitra saat ini <select onchange="fm=+this.value;render()">${P.map((x,i)=>`<option value="${i}" ${i==fm?'selected':''}>${x.n} · ${x.t}</option>`).join('')}</select></label><label>Ganti ke <select onchange="lm=+this.value;render()">${P.map((x,i)=>`<option value="${i}" ${i==lm?'selected':''}>${x.n} · ${x.t}</option>`).join('')}</select></label></div>
<div class="grid"><div class="kpi"><b style="color:${b.c>a.c?'var(--rd)':'var(--gr)'}">${b.c-a.c>0?'+':''}${b.c-a.c} rb</b><span>Selisih tarif</span></div><div class="kpi"><b style="color:var(--gr)">${Math.round((b.e/a.e-1)*100)}%</b><span>Perubahan emisi</span></div><div class="kpi"><b>${ctc(b)-ctc(a)>0?'+':''}${ctc(b)-ctc(a)} rb</b><span>Selisih total cost-to-serve</span></div><div class="kpi"><b>${b.o-a.o>0?'+':''}${b.o-a.o} poin</b><span>On-time rate</span></div></div><p class="note">Fitur analisis khusus ini masuk paket tambahan (Revenue Stream 3).</p></div>`}
if(view=='pal'){h=`<div class="card"><h2>Color palette</h2><p class="s">Oranye dan navy terinspirasi identitas KAI/KAI Access (kode warna perkiraan, bukan resmi), hijau dibuat lebih dewasa.</p><div class="pal">${[['#F26B1D','Orange Primary','Tombol & aksen utama'],['#1B2E5A','Navy','Header & teks judul'],['#0F7B5F','Emerald','Status baik, emisi rendah'],['#E1F2EB','Mint Soft','Latar kartu hijau'],['#FDE9DC','Peach Soft','Sorotan & info'],['#F5F6FA','Cloud','Latar halaman'],['#C93C3C','Alert Red','Perlu evaluasi']].map(c=>`<div style="background:${c[0]};color:${['#E1F2EB','#FDE9DC','#F5F6FA'].includes(c[0])?'#1A2233':'#fff'}"><b>${c[1]}</b>${c[0]}<br>${c[2]}</div>`).join('')}</div></div>`}
m.innerHTML=h}
function ctc(p){return Math.round(p.c+(100-p.o)*6+p.d*40+p.e*.8+(100-p.s)*5)}
function why(p){return p.e<30?'Emisi sangat rendah, paling andal':p.c<750?'Tarif terendah, emisi tinggi':'Seimbang biaya, emisi, layanan'}
function rl(S,ord){return ord.map((i,r)=>`<div class="rank ${r?'':'top'}"><div class="rk">${r+1}</div><div><b>${P[i].n}</b> · ${P[i].t}<br><span class="note">${why(P[i])}</span></div><div class="sc">${S[i]}</div></div>`).join('')}
function upd(){const S=topsis(),o=P.map((p,i)=>i).sort((a,b)=>S[b]-S[a]);document.getElementById('rl').innerHTML=rl(S,o);document.querySelectorAll('.sl b').forEach((e,j)=>e.textContent=W[j])}
render();
</script></body></html>
